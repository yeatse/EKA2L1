# Builds a distribution-signed iOS archive and uploads it to TestFlight: on
# every push to the ios-next branch, and on a schedule whenever upstream's
# master has moved (see the note above the triggers for what each mode builds).
#
# This is the only place anything is signed. build.yml -- which is shared with
# upstream -- builds the device slice unsigned and stops there, because signing
# on a shared CI means minting a development certificate against Apple's
# per-account cap on every merge, and uploading to one account's App Store
# Connect record.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID           Apple Developer team id (e.g. L6JP27B8YR)
#   APPSTORE_ISSUER_ID      App Store Connect API key issuer id (UUID)
#   APPSTORE_KEY_ID         App Store Connect API key id
#   APPSTORE_PRIVATE_KEY    Full contents of the AuthKey_<KEY_ID>.p8 file
#
# Strongly recommended secrets:
#   IOS_DEV_SIGNING_KEY             base64-encoded .p12 (Apple Development
#                                   certificate + private key)
#   IOS_DEV_SIGNING_KEY_PASSWORD    password of that .p12
#   Without a persisted Development certificate, every run mints a brand-new
#   one via -allowProvisioningUpdates (the previous ephemeral runner's private
#   key is gone), piling up "Created via API" certificates until the account
#   hits Apple's cap and archives fail with "Your account has reached the
#   maximum number of certificates". Easiest setup: run the manual
#   "iOS Provision Dev Certificate" workflow, which creates the certificate
#   via the App Store Connect API on the runner and writes both secrets
#   (needs a GH_SECRETS_ADMIN_TOKEN PAT, see that workflow's header).
#   Alternatively export the .p12 from Keychain Access on a Mac that has the
#   certificate, then:
#     base64 -i dev.p12 | gh secret set IOS_DEV_SIGNING_KEY
#     gh secret set IOS_DEV_SIGNING_KEY_PASSWORD
#   Stale API-created certificates can be listed/revoked with the manual
#   "iOS Signing Maintenance" workflow.
#
# Optional secrets (only needed if the team does not use Xcode cloud-managed
# distribution certificates; when set, the certificate is imported into a
# throwaway keychain and used for signing instead):
#   IOS_DIST_SIGNING_KEY            base64-encoded .p12 (Apple Distribution
#                                   certificate + private key)
#   IOS_DIST_SIGNING_KEY_PASSWORD   password of that .p12
#
# Notes:
# - The API key needs the Admin role the first time cloud signing creates a
#   distribution certificate; App Manager is enough afterwards.
# - The bundle id (com.eka2l1.emulator) must already exist as an app record
#   in App Store Connect.
# - CFBundleVersion is hardcoded in Info.plist; manageAppVersionAndBuildNumber
#   in the export options lets Xcode bump the build number to the next valid
#   value during upload, so pushes don't collide on TestFlight build numbers.
# - When the secrets are not configured (e.g. forks), the job logs a warning
#   and skips instead of failing.

name: iOS TestFlight

# Two modes, deliberately separate:
#
#   push to `ios` / workflow_dispatch  -> build this fork's branch, as before.
#   schedule                           -> build upstream's master, if it moved.
#
# The scheduled mode exists because the iOS port is upstream now (#587), so
# "does upstream's master still work on a phone" is a question worth answering
# on every merge rather than whenever somebody remembers to check. It builds
# upstream's tree, not this fork's: a TestFlight build from it contains nothing
# that has not been sent upstream, which is the whole point -- a regression it
# shows is a regression upstream users would get.
#
# The upload is skipped when upstream's master has not moved since the last one,
# tracked by a `tf-upload/<sha>` tag in this repository. Only the current
# upstream HEAD is ever considered: if several commits land between two runs,
# the intermediate ones are not backfilled, because a rolling TestFlight build
# of a superseded commit has no audience.

on:
  push:
    branches:
      - ios-next
  schedule:
    # Upstream merges arrive in bursts, so poll rather than pick a daily hour.
    # GitHub throttles (and eventually disables) schedules on dormant repos;
    # this one stays active, but that is worth knowing if runs go quiet.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      track_upstream:
        description: "Build upstream's master (like the scheduled run) instead of this branch"
        type: boolean
        default: false
      force:
        description: "With track_upstream: upload even if this commit was already sent"
        type: boolean
        default: false

permissions:
  contents: write

# Upstream-tracking runs share one group and never cancel each other: a build
# takes longer than the poll interval, so cancelling in progress meant every
# tick killed the previous one and nothing was ever uploaded. GitHub keeps at
# most one queued run per group, and a queued run re-checks upstream when it
# starts, so a burst of ticks collapses into one build rather than a backlog.
# Branch pushes keep the old behaviour, where a newer push does supersede.
concurrency:
  group: ios-testflight-${{ (github.event_name == 'schedule' || inputs.track_upstream == true) && 'upstream' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && inputs.track_upstream != true }}

jobs:
  upload:
    name: Build and upload to TestFlight
    runs-on: macos-26
    env:
      EKA2L1_IOS_CONFIGURATION: Release
      ARCHIVE_PATH: build/ios-device/EKA2L1.xcarchive
      TRACK_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.track_upstream == true }}

    steps:
      - name: Check TestFlight secrets
        id: guard
        env:
          CONFIGURED: ${{ secrets.APPLE_TEAM_ID != '' && secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_PRIVATE_KEY != '' }}
        run: |
          if [ "${CONFIGURED}" != "true" ]; then
            echo "::warning::TestFlight secrets missing (APPLE_TEAM_ID / APPSTORE_ISSUER_ID / APPSTORE_KEY_ID / APPSTORE_PRIVATE_KEY); skipping upload."
          fi
          echo "configured=${CONFIGURED}" >> "${GITHUB_OUTPUT}"

      # Submodules are pulled by the resolve step instead of here: the scheduled
      # run usually finds nothing to do, and cloning the submodule tree (ffmpeg
      # above all) every half hour to then exit is most of the job's cost.
      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Decides what gets built, and whether there is anything to do at all.
      # In branch mode this only reports the commit that was checked out.
      - name: Resolve the commit to build
        if: steps.guard.outputs.configured == 'true'
        id: target
        env:
          FORCE: ${{ inputs.force == true }}
        run: |
          set -euo pipefail

          if [ "${TRACK_UPSTREAM}" != "true" ]; then
            echo "Branch mode: building ${GITHUB_REF_NAME} at $(git rev-parse --short HEAD)"
            git submodule update --init --recursive
            {
              echo "build=true"
              echo "sha=$(git rev-parse HEAD)"
              echo "short_sha=$(git rev-parse --short HEAD)"
              echo "source=${GITHUB_REF_NAME}"
              echo "ffmpeg=$(git -C src/external/ffmpeg rev-parse HEAD)"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git remote add upstream https://github.com/EKA2L1/EKA2L1.git 2>/dev/null || true
          git fetch --no-tags upstream master
          git fetch --tags origin

          UPSTREAM_SHA="$(git rev-parse upstream/master)"
          UPSTREAM_SHORT="$(git rev-parse --short upstream/master)"
          TAG="tf-upload/${UPSTREAM_SHA}"

          echo "Upstream master is at ${UPSTREAM_SHORT}"

          if [ -n "$(git tag -l "${TAG}")" ] && [ "${FORCE}" != "true" ]; then
            echo "Already uploaded ${UPSTREAM_SHORT} (tag ${TAG}); nothing to do."
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Build upstream's tree exactly, submodules included -- this fork's
          # unsent changes must not end up in a build that claims to be upstream.
          git checkout --detach "${UPSTREAM_SHA}"
          git submodule update --init --recursive

          {
            echo "build=true"
            echo "sha=${UPSTREAM_SHA}"
            echo "short_sha=${UPSTREAM_SHORT}"
            echo "source=upstream/master"
            echo "tag=${TAG}"
            echo "ffmpeg=$(git -C src/external/ffmpeg rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      # Same reasoning as build.yml's iOS job: ffmpeg ships no iOS slice and
      # building one takes longer than the app. Keyed on the submodule commit,
      # so a bump rebuilds it and nothing else does.
      - name: Cache iOS ffmpeg
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: src/external/ffmpeg/ios/device
          key: ffmpeg-ios-device-${{ steps.target.outputs.ffmpeg }}

      - name: Select Xcode
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Write App Store Connect API key
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true'
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          printf '%s\n' "${APPSTORE_PRIVATE_KEY}" > "${RUNNER_TEMP}/asc_key.p8"
          chmod 600 "${RUNNER_TEMP}/asc_key.p8"

      - name: Import signing certificates
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true' && (env.HAS_DEV_CERT == 'true' || env.HAS_DIST_CERT == 'true')
        env:
          HAS_DEV_CERT: ${{ secrets.IOS_DEV_SIGNING_KEY != '' }}
          HAS_DIST_CERT: ${{ secrets.IOS_DIST_SIGNING_KEY != '' }}
          IOS_DEV_SIGNING_KEY: ${{ secrets.IOS_DEV_SIGNING_KEY }}
          IOS_DEV_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_DEV_SIGNING_KEY_PASSWORD }}
          IOS_DIST_SIGNING_KEY: ${{ secrets.IOS_DIST_SIGNING_KEY }}
          IOS_DIST_SIGNING_KEY_PASSWORD: ${{ secrets.IOS_DIST_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="${RUNNER_TEMP}/eka2l1-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          if [ "${HAS_DEV_CERT}" = "true" ]; then
            printf '%s' "${IOS_DEV_SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/dev_cert.p12"
            security import "${RUNNER_TEMP}/dev_cert.p12" \
              -P "${IOS_DEV_SIGNING_KEY_PASSWORD}" \
              -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          fi
          if [ "${HAS_DIST_CERT}" = "true" ]; then
            printf '%s' "${IOS_DIST_SIGNING_KEY}" | base64 --decode > "${RUNNER_TEMP}/dist_cert.p12"
            security import "${RUNNER_TEMP}/dist_cert.p12" \
              -P "${IOS_DIST_SIGNING_KEY_PASSWORD}" \
              -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          fi
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null
          security list-keychains -d user -s "${KEYCHAIN}" login.keychain-db

      - name: Build signed archive
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true'
        env:
          EKA2L1_IOS_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          EKA2L1_ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          EKA2L1_ASC_KEY_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          export EKA2L1_ASC_KEY_PATH="${RUNNER_TEMP}/asc_key.p8"
          export EKA2L1_IOS_ARCHIVE_PATH="${ARCHIVE_PATH}"
          scripts/build_ios.sh archive

      - name: Upload to TestFlight
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_PLIST="${RUNNER_TEMP}/ExportOptions.plist"
          cat > "${EXPORT_PLIST}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${APPLE_TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportOptionsPlist "${EXPORT_PLIST}" \
            -exportPath "${RUNNER_TEMP}/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/asc_key.p8" \
            -authenticationKeyID "${APPSTORE_KEY_ID}" \
            -authenticationKeyIssuerID "${APPSTORE_ISSUER_ID}"

      # Named after the commit that was actually built, which in the scheduled
      # mode is upstream's HEAD rather than github.sha.
      - name: Upload dSYM artifact
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EKA2L1-testflight-dSYM-${{ steps.target.outputs.short_sha }}
          path: ${{ env.ARCHIVE_PATH }}/dSYMs
          if-no-files-found: warn

      # Only after a successful upload, so a failed run is retried on the next
      # tick instead of being recorded as done.
      - name: Mark this upstream commit as uploaded
        if: steps.guard.outputs.configured == 'true' && steps.target.outputs.build == 'true' && steps.target.outputs.tag != ''
        env:
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git tag -f "${TAG}" "${SHA}"
          git push -f origin "refs/tags/${TAG}"

      - name: Clean up signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/asc_key.p8" "${RUNNER_TEMP}/dev_cert.p12" "${RUNNER_TEMP}/dist_cert.p12"
          if [ -f "${RUNNER_TEMP}/eka2l1-signing.keychain-db" ]; then
            security delete-keychain "${RUNNER_TEMP}/eka2l1-signing.keychain-db" || true
            security list-keychains -d user -s login.keychain-db
          fi
